server:
  port: 8082

spring:
  application:
    name: agent-connector-app

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.selfdevelopment.agentconnector: DEBUG
    org.springframework.web: INFO
